name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER)'
no-changes-template: '- Keine Änderungen seit dem letzten Release.'
version-resolver:
  major:
    labels: ['major']
  minor:
    labels: ['minor', 'feature']
  patch:
    labels: ['patch', 'fix', 'bug']
  default: patch
categories:
  - title: '✨ Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'ci'
      - 'docs'
template: |
  ## Änderungen

  $CHANGES

  ## Installation

  - HACS: Update ausführen und Browser-Cache leeren.
  - Manuell: `dist/keepassxc-otp-card.js` aus diesem Release verwenden.
